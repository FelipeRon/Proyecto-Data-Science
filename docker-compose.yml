name: ai4i
x-runtime: &runtime
  image: ai4i-runner:1
  build: .
  env_file: .env
  volumes:
    - ./artifacts:/app/artifacts
    - ./secrets:/run/secrets:ro
services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?Set KESTRA_DB_PASSWORD}
    volumes: [kestra-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kestra]
      interval: 5s
      retries: 20
  kestra:
    image: kestra/kestra:v1.3.44
    user: root
    command: server standalone
    ports: ["127.0.0.1:8080:8080"]
    env_file: .env
    environment:
      ENV_HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:?Set absolute HOST_PROJECT_DIR}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD}
        kestra:
          server:
            basic-auth:
              username: ${KESTRA_USER}
              password: ${KESTRA_PASSWORD}
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          plugins:
            configurations:
              - type: io.kestra.plugin.scripts.runner.docker.Docker
                values:
                  volume-enabled: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - kestra-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
  runner:
    <<: *runtime
    profiles: [tools]
    command: python kestra/scripts/ingest.py
  spark:
    <<: *runtime
    profiles: [tools]
    command: >-
      spark-submit --master local[2]
      --packages net.snowflake:spark-snowflake_2.12:3.1.3,net.snowflake:snowflake-jdbc:3.24.2
      spark/build_obt.py
volumes:
  kestra-db:
  kestra-storage:
